    <link rel="icon" type="image/x-icon" href="./favicon.ico" />

    <meta property="og:image" content="./logo-3mr.png" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Outfit:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Fallback: Jika pengguna memilih root /(root) di GitHub Pages, redirect otomatis ke /docs/
      if (window.location.hostname.endsWith('github.io') && !window.location.pathname.includes('/docs')) {
        var cleanPath = window.location.pathname.replace(/\/+$/, '');
        window.location.replace(cleanPath + '/docs/' + window.location.search + window.location.hash);
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
