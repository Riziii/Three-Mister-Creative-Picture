<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Anton&amp;display=swap');
      .logo-text {
        font-family: 'Anton', 'Impact', 'Bebas Neue', 'Arial Black', sans-serif;
        font-weight: 900;
        font-size: 260px;
        text-anchor: middle;
        dominant-baseline: central;
        letter-spacing: -3px;
      }
      .c-maroon {
        fill: #680A0A;
      }
      .c-black {
        fill: #000000;
      }
    </style>
  </defs>
  <text x="250" y="150" class="logo-text">
    <tspan class="c-maroon">3</tspan><tspan class="c-black">MR</tspan>
  </text>
